# OrangeVC Nginx 配置模板（放在 http {} 内）
# 安装脚本会注入官网域名与证书路径；内部 /data/orangejd 路径保持不变。

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/m;

server {
    listen 80;
    server_name @@ORANGEVC_DOMAIN@@;
    return 301 https://@@ORANGEVC_DOMAIN@@$request_uri;
}

server {
    listen 443 ssl http2;
    server_name @@ORANGEVC_DOMAIN@@;
    server_tokens off;
    charset utf-8;

    ssl_certificate @@SSL_CERTIFICATE@@;
    ssl_certificate_key @@SSL_CERTIFICATE_KEY@@;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' https:; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com https://player.bilibili.com https://www.youtube-nocookie.com; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://@@ORANGEVC_DOMAIN@@ https://challenges.cloudflare.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 205m;

    # Vite 文件名带内容哈希，可长期缓存；HTML 仍按默认策略校验更新。
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/assets/ {
        root /data/orangejd/web-dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 管理后台
    location ^~ /admin/ {
        root /data/orangejd/web-dist;
        try_files $uri $uri/ /admin/index.html;
    }

    location ^~ /assets/ {
        root /data/orangejd/web-dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 搜索引擎与安全联系文件必须真实存在，禁止回退到 SPA 登录页。
    location = /robots.txt {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    location = /.well-known/security.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    # Never let hidden files or repository metadata fall through to the SPA.
    # The RFC 9116 security contact above is the only supported dot path.
    location ~ (^|/)\.(?!well-known(?:/|$)) {
        return 404;
    }

    # 用户端
    location / {
        root /data/orangejd/web-dist;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Generic /api/ proxy strips the prefix; payment callback must retain it.
    location = /api/epay/notify {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080/api/epay/notify;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/app/auth/login {
        limit_req zone=auth_per_ip burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080/app/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/admin/auth/login {
        limit_req zone=auth_per_ip burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080/admin/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # 上传文件
    location /uploads/ {
        alias /data/orangejd/uploads/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        allow 127.0.0.1;
        deny all;
    }
}
