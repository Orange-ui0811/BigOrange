name: CI

on:
  push:
    branches: [main, V2, V3]
  pull_request:
    branches: [main, V2, V3]

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis-stack:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      RAG_B_REDIS_TEST_HOST: 127.0.0.1
      RAG_B_REDIS_TEST_PORT: 6379
      RAG_B_REDIS_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test backend and architecture rules
        run: mvn -B clean verify

  flyway-empty-database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: orangevc-ci
          MYSQL_DATABASE: orangevc
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -porangevc-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Apply V1 through latest migration to an empty database
        env:
          MYSQL_PWD: orangevc-ci
        run: |
          find orange-server/src/main/resources/db/migration \
            -maxdepth 1 -name 'V*.sql' -print0 \
            | sort -zV \
            | while IFS= read -r -d '' migration; do
                echo "Applying $migration"
                mysql -h 127.0.0.1 -uroot orangevc < "$migration"
              done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate customer persistence, graph and context isolation
        env:
          MYSQL_PWD: orangevc-ci
          CUSTOMER_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/customer_acceptance_ci?allowPublicKeyRetrieval=true&useSSL=false
          CUSTOMER_EMPTY_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/customer_acceptance_ci_empty?allowPublicKeyRetrieval=true&useSSL=false
          CUSTOMER_TEST_MYSQL_USER: root
          CUSTOMER_TEST_MYSQL_PASSWORD: orangevc-ci
          CUSTOMER_CONTEXT_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/customer_context_acceptance_ci?allowPublicKeyRetrieval=true&useSSL=false
          CUSTOMER_CONTEXT_TEST_MYSQL_USER: root
          CUSTOMER_CONTEXT_TEST_MYSQL_PASSWORD: orangevc-ci
        run: |
          mysql -h 127.0.0.1 -uroot -e 'CREATE DATABASE customer_acceptance_ci; CREATE DATABASE customer_acceptance_ci_empty; CREATE DATABASE customer_context_acceptance_ci;'
          mvn -B -pl orange-server -am -Dtest=CustomerPersistenceIntegrationTest,CustomerGraphPersistenceTest,CustomerContextMysqlIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            orange-web/package-lock.json
            orange-admin/package-lock.json
      - name: Validate user application
        working-directory: orange-web
        run: |
          npm ci
          npm run lint -- --max-warnings 65
          npm run typecheck
          npm run test:coverage
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Validate admin application
        working-directory: orange-admin
        run: |
          npm ci
          npm run lint -- --max-warnings 19
          npm run typecheck
          npm test -- --run
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Enforce architecture size budgets
        run: node scripts/check-architecture-budgets.mjs
      - name: Enforce JavaScript bundle budget
        run: node scripts/check-frontend-bundles.mjs
      - name: Install Playwright browser
        working-directory: orange-web
        run: npx playwright install --with-deps chromium
      - name: Run critical user flows
        working-directory: orange-web
        run: npm run test:e2e

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
