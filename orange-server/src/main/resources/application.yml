server:
  port: 8080

spring:
  profiles:
    active: dev
  servlet:
    encoding:
      charset: UTF-8
      force: true
    multipart:
      max-file-size: 200MB
      max-request-size: 205MB
  main:
    allow-circular-references: true
  cache:
    type: redis
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  redis:
    host: ${orange.redis.host}
    port: ${orange.redis.port}
    password: ${orange.redis.password}
    database: ${orange.redis.database}

mybatis:
  mapper-locations: classpath:mapper/*.xml

logging:
  level:
    com.orangejd: info

orange:
  trade:
    simulated-payment-enabled: false
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:15173,http://localhost:15174}
  upload:
    path: D:/Orangejd/uploads
  jwt:
    admin-secret-key: change-me-admin
    admin-ttl: 7200000
    admin-token-name: Admin-Token
    app-secret-key: change-me-app
    app-ttl: 7200000
    app-token-name: App-Token
  oss:
    endpoint: ${orange.oss.endpoint}
    access-key-id: ${orange.oss.access-key-id}
    access-key-secret: ${orange.oss.access-key-secret}
    bucket-name: ${orange.oss.bucket-name}
