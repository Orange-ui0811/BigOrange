server:
  port: 8080

spring:
  profiles:
    active: dev
  servlet:
    encoding:
      charset: UTF-8
      force: true
    multipart:
      max-file-size: 200MB
      max-request-size: 205MB
  main:
    allow-circular-references: true
  cache:
    type: redis
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  redis:
    host: ${orange.redis.host}
    port: ${orange.redis.port}
    password: ${orange.redis.password}
    database: ${orange.redis.database}

mybatis:
  mapper-locations: classpath:mapper/*.xml

logging:
  level:
    com.orangejd: info

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: orangevc

orange:
  rag-b:
    enabled: ${RAG_B_ENABLED:false}
    redis-prefix: ${RAG_B_REDIS_PREFIX:orange:rag:b:}
    max-file-bytes: ${RAG_B_MAX_FILE_BYTES:1048576}
    chunk-size: ${RAG_B_CHUNK_SIZE:500}
    chunk-overlap: ${RAG_B_CHUNK_OVERLAP:50}
    max-chunks: ${RAG_B_MAX_CHUNKS:4096}
    embedding-batch-size: ${RAG_B_EMBEDDING_BATCH_SIZE:16}
    embedding-provider: ${RAG_B_EMBEDDING_PROVIDER:GITEE}
    embedding-revision: ${RAG_B_EMBEDDING_REVISION:}
    ollama-base-url: ${RAG_B_OLLAMA_BASE_URL:http://localhost:11434}
    ollama-model: ${RAG_B_OLLAMA_MODEL:bge-m3:orangejd-v1}
    search-candidate-limit: ${RAG_B_SEARCH_CANDIDATE_LIMIT:20000}
    route-candidate-limit: ${RAG_B_ROUTE_CANDIDATE_LIMIT:128}
    fusion-candidate-limit: ${RAG_B_FUSION_CANDIDATE_LIMIT:80}
    rerank:
      enabled: ${RAG_B_RERANK_ENABLED:false}
      endpoint: ${RAG_B_RERANK_ENDPOINT:}
      api-key: ${RAG_B_RERANK_API_KEY:}
      model: ${RAG_B_RERANK_MODEL:bge-reranker-v2-m3}
      max-candidates: ${RAG_B_RERANK_MAX_CANDIDATES:80}
      batch-size: ${RAG_B_RERANK_BATCH_SIZE:20}
      timeout-millis: ${RAG_B_RERANK_TIMEOUT_MILLIS:5000}
      max-concurrent-requests: ${RAG_B_RERANK_MAX_CONCURRENT_REQUESTS:2}
      max-request-characters: ${RAG_B_RERANK_MAX_REQUEST_CHARACTERS:300000}
    github-sync-enabled: ${RAG_B_GITHUB_SYNC_ENABLED:false}
    github-sync-limit: ${RAG_B_GITHUB_SYNC_LIMIT:50}
    github-sync-cron: "${RAG_B_GITHUB_SYNC_CRON:0 15 4 * * *}"
  customer:
    enabled: ${CUSTOMER_ENABLED:false}
    execution-engine: ${CUSTOMER_EXECUTION_ENGINE:LANGGRAPH4J}
    raw-access-enabled: ${CUSTOMER_RAW_ACCESS_ENABLED:false}
    model: ${CUSTOMER_MODEL:deepseek-flash}
    thinking: ${CUSTOMER_THINKING:false}
    native-actions: ${CUSTOMER_NATIVE_ACTIONS:false}
    allowed-accounts: ${CUSTOMER_ALLOWED_ACCOUNTS:}
    all-authenticated-users: ${CUSTOMER_ALL_AUTHENTICATED_USERS:true}
    max-concurrent: 2
    run-seconds: 90
    model-seconds: 45
    input-tokens: 6000
    output-tokens: 1500
    action-output-tokens: ${CUSTOMER_ACTION_OUTPUT_TOKENS:4096}
    evidence-output-tokens: ${CUSTOMER_EVIDENCE_OUTPUT_TOKENS:2048}
    verification-output-tokens: ${CUSTOMER_VERIFICATION_OUTPUT_TOKENS:2048}
    evidence-thinking: ${CUSTOMER_EVIDENCE_THINKING:false}
    verification-thinking: ${CUSTOMER_VERIFICATION_THINKING:false}
    purpose-thinking: ${CUSTOMER_PURPOSE_THINKING:false}
    purpose-output-tokens: ${CUSTOMER_PURPOSE_OUTPUT_TOKENS:2048}
    purpose-seconds: ${CUSTOMER_PURPOSE_SECONDS:30}
    purpose-retry-reserve-seconds: ${CUSTOMER_PURPOSE_RETRY_RESERVE_SECONDS:10}
  bootstrap-admin:
    username: ${ORANGE_ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ORANGE_ADMIN_BOOTSTRAP_PASSWORD:}
  trade:
    simulated-payment-enabled: false
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:15173,http://localhost:15174}
  upload:
    path: D:/Orangejd/uploads
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  jwt:
    admin-secret-key: change-me-admin
    admin-ttl: 7200000
    admin-token-name: Admin-Token
    app-secret-key: change-me-app
    app-ttl: 7200000
    app-token-name: App-Token
  oss:
    enabled: ${OSS_ENABLED:false}
    endpoint: ${OSS_ENDPOINT:}
    public-endpoint: ${OSS_PUBLIC_ENDPOINT:}
    region: ${OSS_REGION:cn-shanghai}
    access-key-id: ${OSS_ACCESS_KEY:}
    access-key-secret: ${OSS_ACCESS_SECRET:}
    bucket-name: ${OSS_BUCKET:}
    signed-url-ttl-seconds: ${OSS_SIGNED_URL_TTL_SECONDS:300}
