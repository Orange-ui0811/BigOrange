# ============================================================
# OrangeJD 生产环境配置
# 启动方式: java -jar orange-server.jar --spring.profiles.active=prod
# 敏感信息通过环境变量注入，不写在配置文件里
# ============================================================

spring:
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:orangevc}?sslMode=REQUIRED&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      client-type: jedis
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB:0}
  ai:
    vectorstore:
      redis:
        initialize-schema: true

orange:
  trade:
    simulated-payment-enabled: false
  security:
    allowed-origins: ${ALLOWED_ORIGINS}
  jwt:
    admin-secret-key: ${JWT_ADMIN_SECRET}
    admin-ttl: ${JWT_ADMIN_TTL:7200000}
    admin-token-name: Admin-Token
    app-secret-key: ${JWT_APP_SECRET}
    app-ttl: ${JWT_APP_TTL:7200000}
    app-token-name: App-Token
  upload:
    path: ${UPLOAD_PATH:/data/orangejd/uploads}
  public-base-url: ${PUBLIC_BASE_URL}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    database: ${REDIS_DB:0}
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY}
  oss:
    enabled: ${OSS_ENABLED:false}
    endpoint: ${OSS_ENDPOINT:}
    public-endpoint: ${OSS_PUBLIC_ENDPOINT:}
    region: ${OSS_REGION:cn-shanghai}
    access-key-id: ${OSS_ACCESS_KEY:}
    access-key-secret: ${OSS_ACCESS_SECRET:}
    bucket-name: ${OSS_BUCKET:}
    signed-url-ttl-seconds: ${OSS_SIGNED_URL_TTL_SECONDS:300}
  leaderboard:
    github-token: ${GITHUB_TOKEN:}
    local-cache-ttl-minutes: ${LEADERBOARD_LOCAL_CACHE_TTL:15}
    refresh-cron: ${LEADERBOARD_REFRESH_CRON:0 0 2 * * 1}
    refresh-zone: ${LEADERBOARD_REFRESH_ZONE:Asia/Shanghai}
  ai-audit:
    endpoint: ${AI_AUDIT_ENDPOINT:}
    api-key: ${AI_AUDIT_KEY:}
    model: ${AI_AUDIT_MODEL:deepseek-v4-pro}
  ai-trend:
    endpoint: ${AI_TREND_ENDPOINT:}
    api-key: ${AI_TREND_KEY:}
    model: ${AI_TREND_MODEL:DeepSeek-V4-Pro}
  ai-embedding:
    endpoint: ${AI_EMBEDDING_ENDPOINT:https://ai.gitee.com/v1}
    api-key: ${AI_EMBEDDING_KEY:}
    model: ${AI_EMBEDDING_MODEL:bge-small-zh-v1.5}
  epay:
    pid: ${EPAY_PID:}
    key: ${EPAY_KEY:}
    gateway: ${EPAY_GATEWAY:}
    notify-url: ${EPAY_NOTIFY_URL:}
    return-url: ${EPAY_RETURN_URL:}
    order-payments-enabled: ${EPAY_ORDER_PAYMENTS_ENABLED:false}
  feishu:
    webhook-url: ${FEISHU_WEBHOOK_URL:}
    job-webhook-url: ${FEISHU_JOB_WEBHOOK_URL:}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.orangejd: warn
    com.orangejd.server.task.LeaderboardRefreshTask: info
    root: error
